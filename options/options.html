<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VidSnag settings</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page">
    <header>
      <img src="../icons/icon48.png" alt="" width="36" height="36">
      <div>
        <h1>VidSnag settings</h1>
        <p class="muted">Changes are saved automatically and sync with your Chrome profile.</p>
      </div>
    </header>

    <form id="form" autocomplete="off">
      <section>
        <h2>Format &amp; quality</h2>
        <label class="row">
          <span><b>Default resolution</b><small>Pre-selected quality when a video offers several.</small></span>
          <select name="defaultResolution">
            <option value="highest">Highest available</option>
            <option value="2160">4K (2160p)</option>
            <option value="1440">1440p</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
            <option value="lowest">Lowest (smallest file)</option>
          </select>
        </label>
        <label class="row">
          <span><b>Preferred format</b><small>Used when the same video exists in several containers.</small></span>
          <select name="preferredFormat">
            <option value="mp4">MP4</option>
            <option value="webm">WebM</option>
            <option value="any">No preference</option>
          </select>
        </label>
        <label class="row">
          <span><b>HLS stream output</b><small>MP4 plays everywhere. “Original” keeps the raw MPEG-TS segments.</small></span>
          <select name="hlsOutput">
            <option value="mp4">Convert to MP4</option>
            <option value="ts">Original (.ts)</option>
          </select>
        </label>
      </section>

      <section>
        <h2>Saving files</h2>
        <label class="row">
          <span><b>File name</b><small>Tokens: <code>{title}</code> <code>{res}</code> <code>{host}</code> <code>{date}</code> <code>{time}</code></small></span>
          <input type="text" name="filenameTemplate" maxlength="120">
        </label>
        <div class="preview muted" id="namePreview"></div>
        <label class="row">
          <span><b>Subfolder</b><small>Inside your Downloads folder. Leave empty to save directly there.</small></span>
          <input type="text" name="subfolder" maxlength="80" placeholder="(none)">
        </label>
        <label class="row switch">
          <span><b>Ask where to save each file</b><small>Shows Chrome’s “Save as” dialog.</small></span>
          <input type="checkbox" name="saveAs">
        </label>
        <label class="row">
          <span><b>Parallel segment downloads</b><small>For HLS/DASH streams. Higher is faster but some servers throttle.</small></span>
          <input type="number" name="maxConcurrentSegments" min="1" max="16" step="1">
        </label>
      </section>

      <section>
        <h2>Detection</h2>
        <label class="row">
          <span><b>Ignore files smaller than (KB)</b><small>Filters out ads, previews and sound effects.</small></span>
          <input type="number" name="minFileSizeKB" min="0" step="50">
        </label>
        <label class="row switch">
          <span><b>Scan video &amp; audio tags on pages</b><small>In addition to watching network traffic.</small></span>
          <input type="checkbox" name="detectDomMedia">
        </label>
        <label class="row switch">
          <span><b>Show count on the toolbar icon</b></span>
          <input type="checkbox" name="showBadge">
        </label>
        <label class="row switch">
          <span><b>Right-click menu on videos</b></span>
          <input type="checkbox" name="contextMenu">
        </label>
        <label class="row switch">
          <span><b>Desktop notifications</b><small>When a download finishes or fails.</small></span>
          <input type="checkbox" name="notifications">
        </label>
      </section>

      <section>
        <h2>History</h2>
        <label class="row switch">
          <span><b>Keep a download history</b></span>
          <input type="checkbox" name="historyEnabled">
        </label>
        <label class="row">
          <span><b>Forget entries after (days)</b><small>0 keeps them forever (up to 500 entries).</small></span>
          <input type="number" name="historyDays" min="0" max="3650" step="1">
        </label>
        <div class="row">
          <span><b>Stored entries</b><small id="historyInfo">–</small></span>
          <button type="button" class="btn danger" id="clearHistory">Clear history</button>
        </div>
      </section>

      <div class="footer">
        <button type="button" class="btn" id="reset">Restore defaults</button>
        <span id="saved" class="muted" role="status"></span>
      </div>
    </form>
    <p class="muted fine">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd> downloads the best media on the current tab. Change it at chrome://extensions/shortcuts.</p>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
