<!doctype html><html><head><meta charset="utf-8"><title>AES HLS test</title></head><body><h1>AES HLS test</h1>
<video id="v" controls width="640" poster="/media/poster.jpg"></video>
<script>
// Simulates an MSE player (hls.js/dash.js style): fetches manifests + segments with XHR/fetch.
(async () => {
  const urls = ['/media/enc/index.m3u8','/media/enc/e_000.ts'];
  for (const u of urls) { const r = await fetch(u); await r.arrayBuffer(); }
  document.getElementById('v').src = URL.createObjectURL(new MediaSource());
})();
