<!doctype html><html><head><meta charset="utf-8"><title>EME ClearKey movie</title></head><body><h1>Protected playback (EME)</h1>
<video id="v" controls muted width="640" poster="/media/poster.jpg"></video>
<script>
// Real EME flow, like a DRM site: ask for Widevine first (not in this Chromium), fall back to
// ClearKey, play Common-Encryption (cenc) media through MSE, get the licence from a server.
const KID = 'p-YcNz4hkDPCEJH6YHvzuA'; // a7e61c37… in base64url
const cfg = [{ initDataTypes: ['cenc', 'keyids'], videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.64001f"', robustness: '', encryptionScheme: 'cenc' }] }];
const v = document.getElementById('v');
// Capability check for Widevine first (as many players do), then the key system actually used.
navigator.requestMediaKeySystemAccess('com.widevine.alpha', [{ initDataTypes: ['cenc'], videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.64001f"' }] }]).catch(() => null)
  .then(() => navigator.requestMediaKeySystemAccess('org.w3.clearkey', cfg))
  .then((a) => a.createMediaKeys())
  .then((keys) => v.setMediaKeys(keys).then(() => keys))
  .then((keys) => {
    const s = keys.createSession('temporary');
    s.addEventListener('message', async (e) => {
      const r = await fetch('/drm/license', { method: 'POST', body: e.message });
      await s.update(new Uint8Array(await r.arrayBuffer()));
      document.title = 'EME ClearKey movie · licensed';
    });
    return s.generateRequest('keyids', new TextEncoder().encode(JSON.stringify({ kids: [KID] })));
  })
  .then(() => {
    const ms = new MediaSource();
    v.src = URL.createObjectURL(ms);
    ms.addEventListener('sourceopen', async () => {
      const sb = ms.addSourceBuffer('video/mp4; codecs="avc1.64001f"');
      sb.appendBuffer(await (await fetch('/media/drm/sp/video.mp4')).arrayBuffer());
      sb.addEventListener('updateend', () => { try { ms.endOfStream(); } catch {} v.play().catch(() => {}); }, { once: true });
    });
  })
  .catch((e) => { document.title = 'EME failed: ' + e; });
v.addEventListener('timeupdate', () => { if (v.currentTime > 0.5) document.body.dataset.played = 'yes'; });
</script></body></html>
