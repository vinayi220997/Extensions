<!doctype html><html><head><meta charset="utf-8"><title>DRM test</title></head><body><h1>DRM</h1>
<video id="v" controls></video>
<script>
navigator.requestMediaKeySystemAccess('org.w3.clearkey', [{ initDataTypes: ['cenc'], videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.64001f"' }] }])
  .then(a => a.createMediaKeys()).then(k => document.getElementById('v').setMediaKeys(k))
  .then(() => { document.getElementById('v').src = URL.createObjectURL(new MediaSource()); document.title = 'DRM ready'; })
  .catch(e => { document.title = 'DRM failed ' + e; });
</script></body></html>
